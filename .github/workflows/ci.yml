name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: gofmt
        run: task fmt:check

      - name: go vet
        run: task vet

      # golangci-lint runs through its dedicated action (not `task lint`) so CI
      # gets linter-binary caching and inline PR annotations. Keep this version
      # in lock-step with the `lint` task in Taskfile.yml; the rules live in
      # .golangci.yml (the single source of truth for both).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
