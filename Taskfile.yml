version: "3"

# Task definitions are split by domain under ./taskfiles. Each include's
# namespace key reproduces the original colon-prefixed task names exactly, so
# `task <name>` invocations are unchanged. Standalone one-off ops tasks live in
# this root file.

includes:
  commit-staged:    ./taskfiles/commit.yml

tasks:

  default:
    desc: "List all available tasks"
    cmds:
      - task --list
    silent: true

  build:
    desc: "Build the aictl binary"
    cmds:
      - go build ./cmd/aictl

  build:all:
    desc: "Cross-compile release binaries (darwin/linux × amd64/arm64) into ./bin"
    cmds:
      - GOOS=darwin GOARCH=arm64 go build -o bin/aictl-darwin-arm64 ./cmd/aictl
      - GOOS=darwin GOARCH=amd64 go build -o bin/aictl-darwin-amd64 ./cmd/aictl
      - GOOS=linux GOARCH=arm64 go build -o bin/aictl-linux-arm64 ./cmd/aictl
      - GOOS=linux GOARCH=amd64 go build -o bin/aictl-linux-amd64 ./cmd/aictl

  install:
    desc: "Install the aictl binary into GOBIN"
    cmds:
      - go install ./cmd/aictl

  run:
    desc: 'Run aictl from source (pass args after --, e.g. task run -- start "goal")'
    cmds:
      - go run ./cmd/aictl {{.CLI_ARGS}}

  test:
    desc: "Run the test suite"
    cmds:
      - go test ./...

  test:race:
    desc: "Run tests with the race detector and shuffling (matches CI)"
    cmds:
      - go test -race -shuffle=on ./...

  test:cover:
    desc: "Run race tests with coverage and print the total (matches CI)"
    cmds:
      - go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -func=coverage.out | tail -n 1

  fmt:
    desc: "Format all Go files in place"
    cmds:
      - gofmt -w $(git ls-files '*.go')

  fmt:check:
    desc: "Fail if any Go file is not gofmt-ed (matches CI)"
    cmds:
      - |
        unformatted=$(gofmt -l $(git ls-files '*.go'))
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-ed:"
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: "Run go vet"
    cmds:
      - go vet ./...

  lint:
    desc: "Run golangci-lint (pinned to the CI version; no local install needed)"
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  tidy:
    desc: "Tidy and verify go modules"
    cmds:
      - go mod tidy
      - go mod verify

  ci:
    desc: "Run the full CI gate locally (fmt check, vet, lint, race tests)"
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test:race

  clean:
    desc: "Remove build and coverage artifacts"
    cmds:
      - rm -rf bin coverage.out
